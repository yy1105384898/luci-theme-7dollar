name: Build IPK
on:
  push:
    branches: [main]
    paths:
      - 'htdocs/**'
      - 'ucode/**'
      - 'root/**'
      - 'Makefile'
      - 'scripts/build-ipk.sh'
      - '.github/workflows/build-ipk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-ipk-main
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build package
        run: bash scripts/build-ipk.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-7dollar-ipk
          path: dist/*.ipk
      - name: Publish package to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/*.ipk dist/latest.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: update theme IPK [skip ci]'
          git push origin HEAD:main
